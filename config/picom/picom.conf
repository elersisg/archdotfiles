#################################
#             Shadows           #
#################################

shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-color = "#1d2021";  # Color Gruvbox Dark0

#################################
#           Fading              #
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

#################################
#   Transparency / Opacity      #
#################################

frame-opacity = 0.9;

#################################
#           Corners             #
#################################

corner-radius = 10;  # Esquinas redondeadas estilo moderno

#################################
#            Blur               #
#################################

# Configuración de blur para ventanas flotantes
blur: {
  method = "dual_kawase";
  strength = 5;  # Blur ligero
  background = true;
  background-frame = true;
  background-fixed = true;
}

blur-kern = "3x3box";

#################################
#       General Settings        #
#################################

backend = "glx";  # Cambiado a GLX para soporte de animaciones
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;

# Animaciones suaves para mover/redimensionar ventanas
transition-length = 200;  # Duración en ms
transition-pow-x = 0.1;
transition-pow-y = 0.1;
transition-pow-w = 0.1;
transition-pow-h = 0.1;
size-transition = true;

# Excluir elementos de blur y sombras
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Dunst'",
  "_GTK_FRAME_EXTENTS@:c"
];

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#           Rules               #
#################################

rules: ({
  # Tooltips
  match = "window_type = 'tooltip'";
  fade = false;
  shadow = true;
  opacity = 0.85;
  full-shadow = false;
  blur-background = false;
}, {
  # Docks y escritorios
  match = "window_type = 'dock'    || "
          "window_type = 'desktop' || "
          "_GTK_FRAME_EXTENTS@";
  blur-background = false;
  shadow = false;
}, {
  # Ventanas flotantes
  match = "state = 'floating'";
  blur-background = true;  # Blur ligero para flotantes
  shadow = true;
  opacity = 0.95;
}, {
  # Elementos específicos
  match = "name = 'Notification'   || "
          "class_g = 'Conky'       || "
          "class_g ?= 'Notify-osd' || "
          "class_g = 'Cairo-clock' || "
          "_GTK_FRAME_EXTENTS@";
  shadow = false;
  blur-background = false;
}, {
  # Aplicaciones con esquinas cuadradas
  match = "class_g = 'Alacritty' || "
          "class_g = 'Yazi'";
  corner-radius = 0;
})
