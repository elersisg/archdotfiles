
; Importing files 
include-file = ~/.config/polybar/colors.ini

; Barra 1 - Workspaces (sin cambios)
[bar/bar1]
wm-name = bspwm
wm-restack = bspwm
enable-ipc = true
override-redirect = false
fixed-center = true
width = 14%
height = 22
radius = 10
offset-x = 3
offset-y = 4
dim-value = 1.0
line-size = 1
border-size = 2
border-color = ${colors.c14}
background = ${colors.bg}
foreground = ${colors.fg}
module-margin = 0
cursor-click = pointer 
cursor-scroll = ns-resize
font-0 = "JetBrainsMono Nerd Font:size=12:style=medium;2.5"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=15;2.5"
font-2 = "JetBrainsMono Nerd Font:style=bold:size=21;5.3"
modules-left = pm rfl ws

[module/pm]
type = custom/text 
label = 󰣇
label-background = ${colors.c14}
label-foreground = ${colors.c0}
label-padding = 1 
click-left = ~/.config/rofi/powermenu/powermenu.sh

[module/rfl]
type = custom/text
label = 
label-foreground = ${colors.c14}
label-font = 3

[module/ws]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
reverse-scroll = true
fuzzy-match = true
occupied-scroll = false
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5; 
format = "<label-state>"
format-font = 2
format-padding = 0
label-focused = " "
label-focused-foreground = ${colors.c10}
label-focused-background = ${colors.bg}
label-occupied = " "
label-occupied-foreground = ${colors.c16}
label-urgent = " %icon%"
label-urgent-foreground = ${colors.c2}
label-empty = " %icon%"
label-empty-foreground = ${colors.c15}

; Barra 2 - Ventana activa (sin cambios)
[bar/bar2]
wm-name = bspwm
wm-restack = bspwm
enable-ipc = true
override-redirect = false
fixed-center = true
width = 20%
height = 22
radius = 10
offset-x = 14.4%
offset-y = 4
dim-value = 1.0
line-size = 1
border-size = 2 
border-color = ${colors.c14}
background = ${colors.bg}
foreground = ${colors.fg}
module-margin = 0
cursor-click = pointer 
cursor-scroll = ns-resize
font-0 = "JetBrainsMono Nerd Font:size=11:style=medium;2.5"
modules-center = ap

[module/ap]
type = custom/script
exec = ~/.config/polybar/scripts/window-list.sh
interval = 1
tail = true
format = <label>
label = %output%
format-background = ${colors.bg}
format-padding = 0
module-margin-left = 1
module-margin-right = 1


; Barra 3 - Fecha y Hora FIXED
[bar/bar3]
wm-name = bspwm
wm-restack = bspwm
enable-ipc = true
override-redirect = false
fixed-center = true
width = 15%
height = 22
radius = 10
offset-x = 39%
offset-y = 4
dim-value = 1.0
line-size = 2
border-size = 2
border-color = ${colors.c14}
background = ${colors.bg}
foreground = ${colors.fg}
module-margin = 0
cursor-click = pointer 
cursor-scroll = ns-resize
font-0 = "JetBrainsMono Nerd Font:size=12:style=medium;2.5"
; Módulo de fecha/hora combinado
modules-center = datetime

[module/datetime]
type = custom/script
exec = echo " $(date +'%I:%M %p')  $(date +'%a %d %b')"
interval = 1
label = %output%
label-foreground = ${colors.c6}
label-background = ${colors.bg}

; Barra 4 - Spotify (sin cambios)
[bar/bar4]
wm-name = bspwm
wm-restack = bspwm
enable-ipc = true
override-redirect = false
fixed-center = true
width = 15%
height = 22
radius = 10
offset-x = 64.5%
offset-y = 4
dim-value = 1.0
line-size = 1
border-size = 2
border-color = ${colors.c14}
background = ${colors.bg}
foreground = ${colors.fg}
module-margin = 0.5
cursor-click = pointer 
cursor-scroll = ns-resize
font-0 = "JetBrainsMono Nerd Font:size=12:style=medium;2.5"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=15;2.5"
font-2 = "Noto Sans CJK JP;2.5"
font-3 = "Noto Sans CJK KR;2.5"
font-4 = "Noto Sans CJK TC;2.5"
font-5 = "Noto Sans CJK SC;2.5"
font-6 = "Noto Sans Bengali;4"
font-7 = "JetBrainsMono Nerd Font:style=medium;2"
modules-center = spo

[module/spo]
type = custom/script
interval = 0
format = <label>
label = "%output%"
label-foreground = ${colors.c14}
label-font = 8
label-maxlen = 18
exec = ~/.config/polybar/scripts/spo.sh
click-left = playerctl play-pause
click-right = playerctl next
click-middle = playerctl previous
double-click-left = sh -c 'playerctl loop | grep -q "track" && playerctl loop off || playerctl loop track'
tail = true

; Barra 5 - Sistema FIXED (systray integrado)
[bar/bar5]
wm-name = bspwm
wm-restack = bspwm
enable-ipc = true
override-redirect = false
fixed-center = true
width = 14%
height = 22
radius = 10
offset-x = 80.5%
offset-y = 4
dim-value = 1.0
line-size = 1
border-size = 2
border-color = ${colors.c14}
background = ${colors.bg}
foreground = ${colors.fg}
module-margin = 0.5
cursor-click = pointer 
cursor-scroll = ns-resize
SCROLL = true
font-0 = "JetBrainsMono Nerd Font:size=11:style=medium;2.5"
; Módulos incluyendo systray
modules-center = up sp vol sp brt sp btr sp wf sp tray

[module/btr]
type = internal/battery
full-at = 100
battery = BAT1
adapter = ACAD
format-charging = <animation-charging><label-charging>
label-charging = %percentage%%
label-charging-foreground = ${colors.c14}
format-charging-background = ${colors.bg}
format-charging-font = 1
format-discharging = <ramp-capacity><label-discharging>
label-discharging = %percentage%%
format-discharging-background = ${colors.bg} 
label-discharging-foreground = ${colors.c14}
format-discharging-font = 1
format-full-prefix = " "
format-full-prefix-foreground = ${colors.c9}
format-full-prefix-background = ${colors.bg}
format-full-background = ${colors.bg}
low-at = 30%
format-low = <ramp-capacity><label-low>
label-low = %percentage%%
label-low-foreground = ${colors.c2}
format-low-background = ${colors.bg}
format-low-foreground = ${colors.c14}
format-low-font = 1
label-full = %percentage%%
label-full-foreground = ${colors.c14}
label-full-prefix-background = ${colors.bg}
ramp-capacity-0 = " " 
ramp-capacity-1 = " " 
ramp-capacity-2 = " " 
ramp-capacity-3 = " " 
ramp-capacity-4 = " "
ramp-capacity-foreground = ${colors.c9}
animation-charging-0 = " " 
animation-charging-1 = " " 
animation-charging-2 = " " 
animation-charging-3 = " " 
animation-charging-4 = " "
animation-charging-framerate = 750
animation-charging-foreground = ${colors.c9}

[module/brt]
type = internal/backlight
use-actual-brightness = true
poll-interval = 0
enable-scroll = true
scroll-interval = 5
reverse-scroll = true
format = "<ramp><label>"
format-background = ${colors.bg} 
label = %percentage%%
label-foreground = ${colors.c14}
ramp-0 = "󰃞 " 
ramp-1 = "󰃝 "
ramp-2 = "󰃟 " 
ramp-3 = "󰃠 "
ramp-foreground = ${colors.c4}

[module/sp]
type = custom/text
format = ""
format-background = ${colors.bg} 
format-foreground = ${colors.c14}

[module/wf]
type = custom/script
exec = /home/gabrielg/.config/polybar/scripts/wi.sh
interval = 10
tail = true
format-background = ${colors.bg} 
format-foreground = ${colors.c7}
click-left = /home/gabrielg/.config/polybar/scripts/swi.sh

[module/vol]
type = internal/pulseaudio
format-volume = "<ramp-volume><label-volume>"
format-volume-foreground = ${colors.c14}
format-volume-background = ${colors.bg}
format-font = 1
mapped = true
use-ui-max = true
reverse-scroll = true
scroll-intervel = 1
label-volume = %percentage%%
label-volume-foreground = ${colors.c14}
label-muted = " 󰖁 " 
label-muted-foreground = ${colors.c14}
label-muted-background = ${colors.bg} 
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = " "
ramp-volume-4 = " "
ramp-volume-5 = " "
ramp-volume-6 = " "
ramp-volume-7 = " "
ramp-volume-8 = " "
ramp-volume-9 = " "
ramp-volume-foreground = ${colors.c3}
ramp-headphones-0 = " "
ramp-headphones-1 = " "

[module/up]
type = custom/script
interval = 600
format =  " <label>"
format-foreground = ${colors.c13}
label = "%output%"
label-foreground = ${colors.c14}
label-maxlen = 18
exec = ~/.config/polybar/scripts/updt.sh

[module/tray]
type = internal/tray
format-margin = 5px
tray-spacing = 5
tray-size = 16
tray-foreground = ${colors.c14}
tray-background = ${colors.bg}

; Barra 6 - Notificaciones y Clipboard
[bar/bar6]
wm-name = bspwm
wm-restack = bspwm
enable-ipc = true
override-redirect = false
fixed-center = true
width = 5.5% 
height = 22
radius = 10
offset-x = 94.5%
offset-y = 4
dim-value = 1.0
line-size = 1
border-size = 2
border-color = ${colors.c14}
background = ${colors.bg}
foreground = ${colors.c15}
module-margin = 0
cursor-click = pointer 
cursor-scroll = ns-resize
font-0 = "JetBrainsMono Nerd Font:size=12:style=medium;2.5"
modules-center = notif sp6 clip

[module/notif]
type = custom/script
exec = ~/.config/polybar/scripts/notifications.sh
interval = 2
format = <label>
label = %output%
format-padding = 1
format-background = ${colors.c14}
format-foreground = ${colors.c0}
click-left = ~/.config/polybar/scripts/notifications.sh click

[module/clip]
type = custom/script
exec = ~/.config/polybar/scripts/clipboard.sh count
interval = 1  ; Actualización más rápida
format = <label>
label = %output%
format-padding = 1
format-background = ${colors.c16}
format-foreground = ${colors.c0}
click-left = ~/.config/polybar/scripts/clipboard.sh show
format-margin = 0

[module/sp6]
type = custom/text
content = "|"
content-foreground = ${colors.c14}
content-background = ${colors.bg}
format-margin = 0
